<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blinds & Alarm Control</title>
</head>
<body>
    <h1>Blinds & Alarm Control</h1>
    <p id="replyText">Ready</p>
    <hr>
   
    <h3>Manual Control</h3>
    <button id="open">Open Blinds</button>
    <button id="close">Close Blinds</button>
    <br><br>

    <label>Custom Degrees: </label>
    <input type="number" value="45" id="degreesInput">
    <button id="rotateBtn">Rotate</button>
    <br><br>

    <hr>
    <h3>Alarm Schedule (24-Hour Format)</h3>
    <label>Time: </label>
    <input type="number" min="0" max="23" value="7" id="alarmHour" style="width: 50px;"> :
    <input type="number" min="0" max="59" value="0" id="alarmMinute" style="width: 50px;">
    <button id="setAlarmBtn">Set Alarm</button>

    <script src="main.js"></script>
</body>
</html>
